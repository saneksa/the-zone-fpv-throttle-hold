; throttle_hold 1.0 - settings.
; Change a value, save, restart the game.
; throttle_hold/status.txt shows what it did on the last launch.

[mod]

; false = turn throttle_hold off: the game runs as if it were not installed.
enabled=true

[throttle_hold]

; Throttle position (0.0 .. 1.0) at or below which the hold releases and the
; drone arms after a respawn. Default 0.05 = 5% throttle.
release_threshold=0.05
